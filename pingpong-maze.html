<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbita — pingpongowy labirynt</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f5f5f7; background: #080a0e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; height: 100dvh; display: flex; flex-direction: column; }
  header { width: min(1060px, 100%); margin: 0 auto; padding: 24px 28px 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .eyebrow { color: #97a4b7; font-size: 10px; font-weight: 650; letter-spacing: .24em; text-transform: uppercase; }
  h1 { font-size: 28px; letter-spacing: -.045em; margin: 3px 0 0; font-weight: 600; }
  .clock { text-align: right; }
  #time { display: block; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.035em; margin-top: 3px; }
  main { flex: 1; min-height: 160px; position: relative; margin: 0 12px; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .panel { width: min(700px, 100%); margin: 0 auto; padding: 8px 24px 0; text-align: center; }
  #status { font-size: 13px; margin: 0 0 13px; min-height: 20px; color: #aeb9c9; }
  .controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
  button { background: #161c25; border: 1px solid #303a49; border-radius: 9px; color: #e4eaf3; padding: 10px 16px; font: inherit; font-size: 12px; cursor: pointer; transition: background .15s; }
  button:hover { background: #253044; }
  button:focus-visible { outline: 2px solid #a2f2df; outline-offset: 3px; }
  button[aria-pressed="true"] { border-color: #a2f2df; color: #a2f2df; }
  button:disabled { opacity: .4; cursor: default; }
  #restart { background: #e0f5ee; color: #132620; border-color: #e0f5ee; font-weight: 650; }
  #restart:hover { background: #fff; }
  footer { padding: 16px 20px; text-align: center; font-size: 10px; letter-spacing: .06em; color: #8b98aa; }
  @media (max-width: 520px), (max-height: 650px) {
    header { padding: 12px 20px 8px; } h1, #time { font-size: 22px; }
    .panel { padding: 4px 12px 0; } #status { margin-bottom: 8px; font-size: 12px; }
    footer { padding: 10px; } button { padding: 9px 12px; }
  }
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">Pingpongowy labirynt</div><h1>Orbita<span style="color:#a2f2df">.</span></h1></div>
  <div class="clock"><span class="eyebrow">Czas ucieczki</span><output id="time">00:00.000</output></div>
</header>
<main><canvas id="c" aria-label="Sześć białych pierścieni labiryntu i pięć kolorowych kulek. Pierwsza kulka na zewnątrz wygrywa."></canvas></main>
<section class="panel" aria-label="Sterowanie animacją">
  <p id="status" role="status">Pięć kulek. Trzy wyjścia. Która znajdzie drogę?</p>
  <div class="controls">
    <button id="restart" type="button">Nowy wyścig ↗</button>
    <button id="pause" type="button" aria-pressed="false">Pauza</button>
    <button id="trails" type="button" aria-pressed="true">Ślady kulek</button>
  </div>
</section>
<footer>6 PIERŚCIENI &nbsp;·&nbsp; 5 KULEK &nbsp;·&nbsp; Model: GPT-6 Astra</footer>
<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  // Physics stays in world coordinates. Resizing changes only the camera.
  const BALL_RADIUS = 4, WALL_WIDTH = 3, SPEED = 235;
  const CLEARANCE = BALL_RADIUS + WALL_WIDTH / 2;
  const RADII = [58, 102, 146, 190, 234, 278];
  const OUTER = RADII[RADII.length - 1];
  const FIXED_DT = 1 / 240, EPS = 1e-9;
  const COLORS = ['#68e0ff', '#ff81b5', '#ffd36f', '#a5f286', '#ba9bff'];
  const NAMES = ['Błękitna', 'Różowa', 'Złota', 'Zielona', 'Fioletowa'];
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const timeEl = document.getElementById('time'), statusEl = document.getElementById('status');
  const pauseButton = document.getElementById('pause'), trailsButton = document.getElementById('trails');
  const norm = a => (a % TAU + TAU) % TAU;
  const point = (r, a) => ({ x: r * Math.cos(a), y: r * Math.sin(a) });
  const walls = [], gaps = [], balls = [];
  let elapsed = 0, paused = false, winner = null, showTrails = true;
  let width = 0, height = 0, scale = 1, accumulator = 0, lastFrame = null;

  // Three connected routes, with staggered doors. Each band has exactly three
  // partitions spanning that band, and each chamber has an inner and outer door.
  // This fixed layout is deliberately sparse like the supplied hand drawing.
  const rotations = [-65, 6, -32, 39, -10, 54];
  for (let i = 0; i < RADII.length; i++) {
    const r = RADII[i], halfGap = 17 / r;
    const angles = [0, 119, 243].map(a => (a + rotations[i]) * Math.PI / 180);
    gaps.push(angles);
    for (let k = 0; k < 3; k++) {
      const start = angles[k] + halfGap;
      const end = (k === 2 ? angles[0] + TAU : angles[k + 1]) - halfGap;
      walls.push({ type: 'arc', r, start, span: end - start,
        a: point(r, start), b: point(r, end) });
    }
    if (i === 0) continue;
    for (let k = 0; k < 3; k++) {
      const next = k === 2 ? 360 : [0, 119, 243][k + 1];
      const base = [0, 119, 243][k];
      const angle = ((base + next) / 2 + (rotations[i - 1] + rotations[i]) / 2) * Math.PI / 180;
      const a = point(RADII[i - 1], angle), b = point(r, angle);
      const length = r - RADII[i - 1];
      walls.push({ type: 'line', a, b, length,
        ux: (b.x - a.x) / length, uy: (b.y - a.y) / length });
    }
  }

  function onArc(w, x, y) {
    return norm(Math.atan2(y, x) - w.start) <= w.span + EPS;
  }

  // Stable quadratic roots for swept point/circle intersections. All contacts
  // use the drawn wall width, including round caps at both ends of every wall.
  function circleRoots(x, y, vx, vy, radius) {
    const a = vx * vx + vy * vy;
    if (a < EPS) return [];
    const b = x * vx + y * vy, c = x * x + y * y - radius * radius;
    const d = b * b - a * c;
    if (d < 0) return [];
    const q = -b - (b >= 0 ? 1 : -1) * Math.sqrt(d);
    if (Math.abs(q) < EPS) return [-b / a];
    const t1 = q / a, t2 = c / q;
    return t1 < t2 ? [t1, t2] : [t2, t1];
  }

  function wallHit(ball, w, maxTime) {
    let best = null;
    function accept(t, nx, ny) {
      if (t < -EPS || t > maxTime + EPS || (best && t >= best.t)) return;
      if (ball.vx * nx + ball.vy * ny >= -EPS) return;
      best = { t: Math.max(0, t), nx, ny };
    }
    for (const cap of [w.a, w.b]) {
      for (const t of circleRoots(ball.x - cap.x, ball.y - cap.y, ball.vx, ball.vy, CLEARANCE)) {
        if (t < -EPS || t > maxTime + EPS) continue;
        accept(t, (ball.x + ball.vx * t - cap.x) / CLEARANCE,
          (ball.y + ball.vy * t - cap.y) / CLEARANCE);
      }
    }
    if (w.type === 'arc') {
      const distance = Math.hypot(ball.x, ball.y), travel = Math.hypot(ball.vx, ball.vy) * maxTime;
      if (Math.abs(distance - w.r) > CLEARANCE + travel) return best;
      for (const side of [-1, 1]) {
        const r = w.r + side * CLEARANCE;
        for (const t of circleRoots(ball.x, ball.y, ball.vx, ball.vy, r)) {
          if (t < -EPS || t > maxTime + EPS) continue;
          const x = ball.x + ball.vx * t, y = ball.y + ball.vy * t;
          if (onArc(w, x, y)) accept(t, side * x / r, side * y / r);
        }
      }
    } else {
      const nx = -w.uy, ny = w.ux;
      const distance = (ball.x - w.a.x) * nx + (ball.y - w.a.y) * ny;
      const velocity = ball.vx * nx + ball.vy * ny;
      if (Math.abs(velocity) > EPS) {
        for (const side of [-1, 1]) {
          const t = (side * CLEARANCE - distance) / velocity;
          const along = (ball.x + ball.vx * t - w.a.x) * w.ux + (ball.y + ball.vy * t - w.a.y) * w.uy;
          if (along >= -EPS && along <= w.length + EPS) accept(t, side * nx, side * ny);
        }
      }
    }
    return best;
  }

  function pairHit(a, b, maxTime) {
    const dx = a.x - b.x, dy = a.y - b.y, vx = a.vx - b.vx, vy = a.vy - b.vy;
    for (const t of circleRoots(dx, dy, vx, vy, BALL_RADIUS * 2)) {
      if (t < -EPS || t > maxTime + EPS) continue;
      const nx = (dx + vx * t) / (BALL_RADIUS * 2), ny = (dy + vy * t) / (BALL_RADIUS * 2);
      if (vx * nx + vy * ny < -EPS) return { t: Math.max(0, t), nx, ny };
    }
    return null;
  }

  function advance(dt) {
    for (const ball of balls) { ball.x += ball.vx * dt; ball.y += ball.vy * dt; }
    elapsed += dt;
  }

  // Advance the whole system to the earliest contact, resolve it, then consume
  // the remaining time. Pair impacts cannot push another ball through a wall.
  // The iteration guard discards time rather than ever making an unchecked move.
  function simulate(dt) {
    let remaining = dt;
    for (let iteration = 0; remaining > EPS && iteration < 96; iteration++) {
      let event = null, soonest = remaining;
      for (let i = 0; i < balls.length; i++) {
        const ball = balls[i];
        for (const w of walls) {
          const hit = wallHit(ball, w, soonest);
          if (hit && (!event || hit.t < soonest)) {
            soonest = hit.t; event = { ...hit, type: 'wall', i };
          }
        }
        for (let j = i + 1; j < balls.length; j++) {
          const hit = pairHit(ball, balls[j], soonest);
          if (hit && (!event || hit.t < soonest)) {
            soonest = hit.t; event = { ...hit, type: 'pair', i, j };
          }
        }
        // Finish precisely when the entire ball clears the outer wall.
        for (const t of circleRoots(ball.x, ball.y, ball.vx, ball.vy, OUTER + CLEARANCE + 1)) {
          if (t < -EPS || t > soonest) continue;
          const x = ball.x + ball.vx * t, y = ball.y + ball.vy * t;
          if (x * ball.vx + y * ball.vy > 0) {
            soonest = Math.max(0, t); event = { type: 'exit', i };
          }
        }
      }
      advance(soonest);
      remaining -= soonest;
      if (!event) break;
      const a = balls[event.i];
      if (event.type === 'exit') { finish(event.i); return; }
      // Normalize again to prevent roundoff from accumulating into energy drift.
      const length = Math.hypot(event.nx, event.ny), nx = event.nx / length, ny = event.ny / length;
      if (event.type === 'wall') {
        const dot = a.vx * nx + a.vy * ny;
        a.vx -= 2 * dot * nx; a.vy -= 2 * dot * ny;
      } else {
        const b = balls[event.j];
        const dot = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        a.vx -= dot * nx; a.vy -= dot * ny;
        b.vx += dot * nx; b.vy += dot * ny;
      }
    }
  }

  function formatTime(seconds) {
    const ms = Math.floor(seconds * 1000);
    return `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}.${String(ms % 1000).padStart(3, '0')}`;
  }
  function finish(index) {
    winner = index;
    pauseButton.disabled = true;
    statusEl.textContent = `${NAMES[index]} kulka wygrywa! Czas ucieczki: ${formatTime(elapsed)}.`;
    statusEl.style.color = COLORS[index];
  }
  function reset() {
    balls.length = 0;
    for (let i = 0; i < 5; i++) {
      const p = point(19, i * TAU / 5 - Math.PI / 2), angle = Math.random() * TAU;
      balls.push({ ...p, vx: Math.cos(angle) * SPEED, vy: Math.sin(angle) * SPEED, trail: [] });
    }
    elapsed = 0; paused = false; winner = null; accumulator = 0; lastFrame = null;
    pauseButton.disabled = false; pauseButton.textContent = 'Pauza';
    pauseButton.setAttribute('aria-pressed', 'false');
    statusEl.textContent = 'Pięć kulek. Trzy wyjścia. Która znajdzie drogę?';
    statusEl.style.color = '';
    timeEl.textContent = formatTime(elapsed);
  }
  function resize() {
    const box = canvas.parentElement.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = box.width; height = box.height;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    scale = Math.max(.01, Math.min(width, height) / (2 * (OUTER + 24)));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.save(); ctx.translate(width / 2, height / 2); ctx.scale(scale, scale);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, OUTER + 16, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1b2832'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 31, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#637383'; ctx.font = '8px system-ui'; ctx.textAlign = 'center'; ctx.fillText('START', 0, 3);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = WALL_WIDTH; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const w of walls) {
      ctx.moveTo(w.a.x, w.a.y);
      if (w.type === 'arc') ctx.arc(0, 0, w.r, w.start, w.start + w.span);
      else ctx.lineTo(w.b.x, w.b.y);
    }
    ctx.stroke();
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (showTrails) {
        // Dots never draw a chord across a wall when a ball bounces.
        for (let j = 0; j < b.trail.length; j++) {
          const p = b.trail[j]; ctx.globalAlpha = .28 * (j + 1) / b.trail.length;
          ctx.fillStyle = COLORS[i]; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, TAU); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = COLORS[i]; ctx.shadowBlur = 10;
      ctx.fillStyle = COLORS[i]; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_RADIUS, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffffb0'; ctx.beginPath(); ctx.arc(b.x - 1, b.y - 1.2, 1.1, 0, TAU); ctx.fill();
      if (winner === i) {
        ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, TAU); ctx.stroke();
      }
    }
    ctx.restore();
  }
  function frame(now) {
    const dt = lastFrame === null ? 0 : Math.min((now - lastFrame) / 1000, .05);
    lastFrame = now;
    if (!paused && winner === null && !document.hidden) {
      accumulator += dt;
      let steps = 0;
      while (accumulator >= FIXED_DT && winner === null && steps++ < 12) {
        simulate(FIXED_DT); accumulator -= FIXED_DT;
      }
      if (dt > 0) for (const b of balls) {
        b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 18) b.trail.shift();
      }
      timeEl.textContent = formatTime(elapsed);
    }
    draw(); requestAnimationFrame(frame);
  }
  document.getElementById('restart').addEventListener('click', reset);
  pauseButton.addEventListener('click', () => {
    paused = !paused; accumulator = 0; lastFrame = null;
    pauseButton.textContent = paused ? 'Wznów' : 'Pauza';
    pauseButton.setAttribute('aria-pressed', String(paused));
    statusEl.textContent = paused ? 'Chwila oddechu. Wyścig jest wstrzymany.' : 'Pięć kulek. Trzy wyjścia. Która znajdzie drogę?';
  });
  trailsButton.addEventListener('click', () => {
    showTrails = !showTrails; trailsButton.setAttribute('aria-pressed', String(showTrails));
    for (const b of balls) b.trail.length = 0;
  });
  document.addEventListener('visibilitychange', () => { lastFrame = null; accumulator = 0; });
  new ResizeObserver(resize).observe(canvas.parentElement);
  reset(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
